name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  web:
    # app এর UI/code GitHub Pages এ যায় -> APK আপডেট ছাড়াই app নিজে নিজে আপডেট হয়
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Auto-extract project zip
        run: |
          Z=$(ls -t *.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then
            echo "Extracting $Z"
            rm -rf /tmp/x && mkdir /tmp/x && unzip -qo "$Z" -d /tmp/x
            P=$(find /tmp/x -name package.json -not -path '*/node_modules/*' | head -1)
            [ -n "$P" ] || { echo "::error::zip এর ভেতরে package.json নেই"; exit 1; }
            D=$(dirname "$P"); rm -rf "$D/.github"
            cp -a "$D"/. .
            rm -rf /tmp/x
          else
            echo "No zip found, using repo files"
          fi
      - name: Check required files
        run: |
          miss=0
          for f in www/index.html www/sw.js www/manifest.json www/offline.html www/vendor/pdf.min.js www/vendor/pdf.worker.min.js package.json keystore/debug.keystore; do
            [ -f "$f" ] || { echo "::error::MISSING FILE: $f (MyDrive-project.zip টা repo তে upload করুন)"; miss=1; }
          done
          exit $miss
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: dep
        uses: actions/deploy-pages@v4
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auto-extract project zip
        run: |
          Z=$(ls -t *.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then
            echo "Extracting $Z"
            rm -rf /tmp/x && mkdir /tmp/x && unzip -qo "$Z" -d /tmp/x
            P=$(find /tmp/x -name package.json -not -path '*/node_modules/*' | head -1)
            [ -n "$P" ] || { echo "::error::zip এর ভেতরে package.json নেই"; exit 1; }
            D=$(dirname "$P"); rm -rf "$D/.github"
            cp -a "$D"/. .
            rm -rf /tmp/x
          else
            echo "No zip found, using repo files"
          fi
      - name: Check required files
        run: |
          miss=0
          for f in www/index.html www/sw.js www/manifest.json www/offline.html www/vendor/pdf.min.js www/vendor/pdf.worker.min.js package.json keystore/debug.keystore; do
            [ -f "$f" ] || { echo "::error::MISSING FILE: $f (MyDrive-project.zip টা repo তে upload করুন)"; miss=1; }
          done
          exit $miss
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Setup Capacitor
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          URL="https://${OWNER}.github.io/${{ github.event.repository.name }}/"
          echo "App URL: $URL"
          echo "{\"appId\":\"com.myfile.drive\",\"appName\":\"My Drive\",\"webDir\":\"www\",\"server\":{\"url\":\"$URL\",\"errorPath\":\"offline.html\",\"androidScheme\":\"https\"}}" > capacitor.config.json
          npm install
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Fixed signing key (যাতে নতুন APK পুরনোটার ওপর install হয়)
        run: |
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
          npx cap sync android
      - name: Build
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MyDrive.apk
      - uses: actions/upload-artifact@v4
        with: { name: MyDrive-apk, path: MyDrive.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: My Drive v${{ github.run_number }}
          files: MyDrive.apk
